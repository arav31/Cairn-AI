<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API detail | Cairn</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="browser-frame">
    <div class="browser-chrome" aria-hidden="true">
      <span class="window-dot red"></span>
      <span class="window-dot amber"></span>
      <span class="window-dot green"></span>
    </div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Cairn navigation">
        <a class="sidebar-brand" href="/">
          <span class="brand-symbol">C</span>
          <span>Cairn</span>
        </a>
        <nav class="sidebar-nav">
          <a class="active" href="/dashboard"><span>▣</span> My APIs</a>
          <a href="/record"><span>＋</span> Record a workflow</a>
          <a href="/settings"><span>⚙</span> Settings</a>
        </nav>

        <section class="endpoint-card" aria-label="Agent endpoints">
          <h2>Agent endpoints</h2>
          <a href="/mcp"><span>MCP endpoint</span><code>/mcp</code></a>
          <a href="/openapi.json"><span>OpenAPI</span><code>/openapi.json</code></a>
          <a href="/.well-known/cairn.json"><span>Discovery</span><code>/.well-known/cairn.json</code></a>
        </section>
      </aside>

      <main class="app-stage">
        <a class="back-link" href="/dashboard">← My APIs</a>
        <div id="detail-root" aria-live="polite"></div>
      </main>
    </div>
  </div>
  <script src="/common.js"></script>
  <script src="/api-detail.js"></script>
</body>
</html>
